<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scale and chord piano</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="theme-picker">
    <button type="button" class="theme-trigger" aria-label="Themes" aria-haspopup="true" aria-expanded="false">THEMES</button>
    <div class="theme-swatches" aria-label="Color themes">
      <button type="button" class="theme-swatch" data-theme="brass" aria-label="Brass on ink" aria-pressed="true" title="Brass on ink"></button>
      <button type="button" class="theme-swatch" data-theme="paper" aria-label="Rust on paper" aria-pressed="false" title="Rust on paper"></button>
      <button type="button" class="theme-swatch" data-theme="moss" aria-label="Moss and lime" aria-pressed="false" title="Moss and lime"></button>
      <button type="button" class="theme-swatch" data-theme="mono" aria-label="Monochrome" aria-pressed="false" title="Monochrome"></button>
      <button type="button" class="theme-swatch" data-theme="blueprint" aria-label="Blueprint" aria-pressed="false" title="Blueprint"></button>
      <button type="button" class="theme-swatch" data-theme="sand" aria-label="Sand and indigo" aria-pressed="false" title="Sand and indigo"></button>
      <button type="button" class="theme-swatch" data-theme="neon" aria-label="Magenta graphite" aria-pressed="false" title="Magenta graphite"></button>
    </div>
  </div>
  <div class="page-header">
    <h1>Piano Sandbox</h1>
    <div class="midi-controls">
      <div class="midi-actions">
        <button id="addMidiBtn">Connect MIDI</button>
        <p id="midiStatus" class="midi-status" hidden></p>
      </div>
    </div>
  </div>
  <div class="toolbar">
    <label class="toggle" for="latchBtn" title="Latched: tap a MIDI key to leave it on, tap again to turn it off">
      <input type="checkbox" id="latchBtn" class="toggle-input">
      <span class="toggle-text" id="latchText">Latch </span>
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
    </label>
    <label class="labels-toggle"><input type="checkbox" id="labelsToggle" checked> Note labels</label>
    <label class="toggle" for="flatsBtn" title="Spell accidentals as flats (Db, Eb...) instead of sharps (C#, D#...)">
      <input type="checkbox" id="flatsBtn" class="toggle-input">
      <span class="toggle-text flats-option flats-option-left">b</span>
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-text flats-option flats-option-right">#</span>
    </label>
    <div class="scale-picker">
      <label for="scaleSelect"><span class="picker-label">Scale</span> <select id="scaleSelect">
        <option value="">Choose a scale</option></select></label>
      <p id="scaleHint" class="scale-hint" hidden>Play a note to be the root, or ESC to cancel</p>
    </div>
    <button id="clearBtn">Clear</button>
  </div>
  <div class="piano-shell"><div id="kb" class="piano-wrap"></div></div>
  <div class="results">
    <div class="results-col col-left">
      <p class="field-label">Notes</p>
      <p id="notesOut" class="field-value">&mdash;</p>
      <div id="degRow" style="display:none;">
        <p class="field-label">Degrees</p>
        <p id="degOut" class="field-value"></p>
      </div>
    </div>
    <div class="results-col col-right">
      <p class="field-label">Detected</p>
      <p id="nameOut" class="field-value">&mdash;</p>
      <p id="suspectOut" class="field-sub" style="display:none;"></p>
      <div id="diaRow" style="display:none;">
        <p id="diaLabel" class="field-label" style="margin-bottom:6px;">Diatonic chords</p>
        <div id="diaOut" class="chips"></div>
      </div>
    </div>
  </div>
</div>
<!-- Dependency order matters. data.js creates SP; main.js is the only file
     that runs anything. Keep these at the end of <body> so the DOM exists. -->
<script src="js/data.js"></script>
<script src="js/theory.js"></script>
<script src="js/state.js"></script>
<script src="js/midi.js"></script>
<script src="js/keyboard-ui.js"></script>
<script src="js/results-ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
