<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scale and chord piano</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="page-header">
    <h1>Scale and chord piano</h1>
    <div class="midi-controls">
      <p id="midiStatus" class="midi-status">MIDI: no device connected</p>
      <button id="addMidiBtn">Add MIDI device</button>
    </div>
  </div>
  <div class="toolbar">
    <label class="toggle" for="latchBtn" title="Latched: tap a MIDI key to leave it on, tap again to turn it off">
      <input type="checkbox" id="latchBtn" class="toggle-input">
      <span class="toggle-text" id="latchText">Latch </span>
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
    </label>
    <label class="toggle" for="flatsBtn" title="Spell accidentals as flats (Db, Eb...) instead of sharps (C#, D#...)">
      <input type="checkbox" id="flatsBtn" class="toggle-input">
      <span class="toggle-text flats-option flats-option-left">b</span>
      <span class="toggle-track"><span class="toggle-thumb"></span></span>
      <span class="toggle-text flats-option flats-option-right">#</span>
    </label>
    <button id="clearBtn">Clear</button>
    <label class="labels-toggle"><input type="checkbox" id="labelsToggle" checked> Note labels</label>
  </div>
  <div id="kb" class="piano-wrap"></div>
  <div class="results">
    <div class="results-col col-left">
      <p class="field-label">Notes</p>
      <p id="notesOut" class="field-value">&mdash;</p>
      <div id="degRow" style="display:none;">
        <p class="field-label">Degrees</p>
        <p id="degOut" class="field-value"></p>
      </div>
    </div>
    <div class="results-col col-right">
      <p class="field-label">Detected</p>
      <p id="nameOut" class="field-value">&mdash;</p>
      <p id="suspectOut" class="field-sub" style="display:none;"></p>
      <div id="diaRow" style="display:none;">
        <p id="diaLabel" class="field-label" style="margin-bottom:6px;">Diatonic chords</p>
        <div id="diaOut" class="chips"></div>
      </div>
    </div>
  </div>
</div>
<!-- Dependency order matters. data.js creates SP; main.js is the only file
     that runs anything. Keep these at the end of <body> so the DOM exists. -->
<script src="js/data.js"></script>
<script src="js/theory.js"></script>
<script src="js/state.js"></script>
<script src="js/midi.js"></script>
<script src="js/keyboard-ui.js"></script>
<script src="js/results-ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
