<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>scale-piano tests</title>
<link rel="stylesheet" href="style.css">
<style>
.container{max-width:720px;}
#tally{font-size:20px;font-weight:500;margin:0 0 1rem;}
#tally.ok{color:var(--accent);}
#tally.bad{color:#c0392b;}
ol{margin:0;padding-left:1.5rem;}
li{margin:2px 0;font-size:14px;}
li.fail{color:#c0392b;font-weight:500;}
li .got{display:block;color:var(--text-muted);font-size:13px;}
</style>
</head>
<body>
<div class="container">
  <h1>scale-piano tests</h1>
  <p class="midi-status">Loads <code>data.js</code> + <code>theory.js</code> only &mdash; no DOM, no state, no MIDI.</p>
  <p id="tally">running&hellip;</p>
  <ol id="results"></ol>
</div>
<script src="js/data.js"></script>
<script src="js/theory.js"></script>
<script>
(function(){
  const T = SP.theory;
  let pass = 0, fail = 0;
  const list = document.getElementById("results");

  function eq(label, actual, expected){
    const ok = actual === expected;
    ok ? pass++ : fail++;
    const li = document.createElement("li");
    li.className = ok ? "" : "fail";
    li.textContent = (ok ? "ok   " : "FAIL ") + label;
    if (!ok){
      const got = document.createElement("span");
      got.className = "got";
      got.textContent = "expected " + JSON.stringify(expected) + ", got " + JSON.stringify(actual);
      li.appendChild(got);
    }
    list.appendChild(li);
  }

  // detect() -- chords. Args are (pitch classes, bass pitch class).
  eq("C major triad, root position",
     T.detect([0,4,7], 0).label, "C major — root position");
  eq("C major triad, E in bass",
     T.detect([0,4,7], 4).label, "C major — 1st inversion (E in bass)");
  eq("C major triad, G in bass",
     T.detect([0,4,7], 7).label, "C major — 2nd inversion (G in bass)");
  eq("A minor triad",
     T.detect([9,0,4], 9).label, "A minor — root position");
  eq("Cmaj7",
     T.detect([0,4,7,11], 0).label, "C major 7 — root position");
  eq("G7 with F in bass (3rd inversion)",
     T.detect([7,11,2,5], 5).label, "G dominant 7 — 3rd inversion (F in bass)");
  eq("power chord",
     T.detect([0,7], 0).label, "C 5 (power chord) — root position");
  eq("unrecognised set guesses the bass as suspected root",
     T.detect([0,1,6], 0).label, "C ? (unknown chord)");

  // scaleNotesFrom() -- one ascending octave from the struck key, closing on
  // the root an octave up. The player's octave is honoured, not normalised.
  eq("C major from C4 spans C4 to C5",
     T.scaleNotesFrom(60, "0,2,4,5,7,9,11").join(","),
     "60,62,64,65,67,69,71,72");
  eq("the same scale from a different octave just transposes",
     T.scaleNotesFrom(48, "0,2,4,5,7,9,11").join(","),
     "48,50,52,53,55,57,59,60");
  eq("F# major from F#4 closes on F#5",
     T.scaleNotesFrom(66, "0,2,4,6,7,9,11").join(","),
     "66,68,70,72,73,75,77,78");

  // detect() -- scales. >=5 notes prefers the scale dictionary.
  eq("C major scale",
     T.detect([0,2,4,5,7,9,11], 0).label, "C major scale");
  // Bass is tried as the root first, so a rotation that is itself in the
  // dictionary wins outright rather than being called an inversion.
  eq("C major collection over D is dorian, not C major",
     T.detect([0,2,4,5,7,9,11], 2).label, "D dorian mode");
  // The "(x in bass)" fallback only fires when the rotation is NOT in the
  // dictionary -- harmonic minor's modes aren't.
  eq("harmonic minor over its 2nd degree reports the bass",
     T.detect([0,2,3,5,7,8,11], 2).label, "C harmonic minor scale (D in bass)");
  eq("C minor pentatonic",
     T.detect([0,3,5,7,10], 0).label, "C minor pentatonic");
  eq("scale degree formula comes back on the hit",
     T.detect([0,3,5,7,10], 0).hit[2], "1 b3 4 5 b7");

  // detect() -- degrees. Chords/scales carry their own hand-written formula
  // (hit[2], stamped as r.degrees); unmatched sets compute one against the
  // bass as suspected root instead of leaving the player nothing to read.
  eq("known chord's degrees come from its dictionary row",
     T.detect([9,0,4,7], 9).degrees, "1 b3 5 b7");
  eq("hand-written beats naive: augmented spells #5, not b6",
     T.detect([0,4,8], 0).degrees, "1 3 #5");
  eq("hand-written beats naive: diminished 7 spells bb7, not 6",
     T.detect([0,3,6,9], 0).degrees, "1 b3 b5 bb7");
  eq("stacked-thirds order survives even though 9 sorts first by semitone",
     T.detect([0,2,3,7,10], 0).degrees, "1 b3 5 b7 9");
  eq("partial chord (root + 5th only) still gets a formula",
     T.detect([9,4], 9).degrees, "1 5");
  eq("unmatched set computes degrees off the bass",
     T.detect([0,1,6], 0).degrees, "1 b2 b5");
  eq("lowest note is always the suspected root, not the first pitch class",
     T.detect([0,1,6], 1).degrees, "1 4 7");
  eq("flats reach the unknown-chord guess too",
     T.detect([0,1,6], 1, true).label, "Db ? (unknown chord)");
  eq("every CHORDS row carries a degree-formula column",
     SP.data.CHORDS.every(c => c.length === 3), true);
  eq("all seven theme palettes are present",
     Object.keys(SP.data.THEMES).join(","),
     "brass,paper,moss,mono,blueprint,sand,neon");

  // suspects() -- chords rooted on the bass that contain everything held,
  // closest tier only. Root is always the bass, same rule as detect()'s
  // suspected-root guess.
  eq("C G B (1 5 7) suspects both 7th chords one note from completing it",
     T.suspects([0,7,11], 0).map(c => c.name + " +" + c.missing).join(", "),
     "C major 7 +3, C minor major 7 +b3");
  eq("C G B does not also suspect C major 9, which is two notes away",
     T.suspects([0,7,11], 0).some(c => c.name === "C major 9"), false);
  eq("A + E (1 5) suspects all four equally-close triads",
     T.suspects([9,4], 9).map(c => c.name).join(", "),
     "A major, A minor, A sus2, A sus4");
  eq("A minor's missing note from A + E is the b3",
     T.suspects([9,4], 9).find(c => c.name === "A minor").missing, "b3");
  eq("an exact match is never its own suspicion",
     T.suspects([0,4,7], 0).every(c => c.name !== "C major"), true);
  eq("nothing suspects a set no chord contains",
     T.suspects([0,1,6], 0).length, 0);
  eq("suspects respells with flats",
     T.suspects([1,8], 1, true)[0].name.startsWith("Db "), true);

  // diatonic()
  eq("triads of C major",
     T.diatonic(0, SP.data.MAJOR_IV).map(c => c.name).join(" "),
     "C Dm Em F G Am B°");
  eq("roman numerals of C major",
     T.diatonic(0, SP.data.MAJOR_IV).map(c => c.rn).join(" "),
     "I ii iii IV V vi vii°");
  eq("triads of A natural minor",
     T.diatonic(9, SP.data.MINOR_IV).map(c => c.name).join(" "),
     "Am B° C Dm Em F G");
  eq("harmonic minor gives an augmented III",
     T.diatonic(0, "0,2,3,5,7,8,11").map(c => c.rn).join(" "),
     "i ii° III+ iv V VI vii°");
  eq("non-7-note scale has no diatonic triads",
     T.diatonic(0, "0,2,4,7,9"), null);

  // keyContext() -- the logic that used to live inside render().
  eq("scale gets the plain diatonic label",
     T.keyContext(T.detect([0,2,4,5,7,9,11], 0)).label, "Diatonic chords");
  eq("major-family chord names its key",
     T.keyContext(T.detect([0,4,7,11], 0)).label,
     "Chords in the key of C major (this chord as I)");
  eq("minor-family chord names its key",
     T.keyContext(T.detect([9,0,4], 9)).label,
     "Chords in the key of A minor (this chord as I)");
  eq("major-family chord yields that key's triads",
     T.keyContext(T.detect([0,4,7], 0)).chords.map(c => c.name).join(" "),
     "C Dm Em F G Am B°");
  eq("pentatonic gets no chips (not 7 notes)",
     T.keyContext(T.detect([0,3,5,7,10], 0)), null);
  eq("no match yields no key context",
     T.keyContext(T.detect([0,1,6], 0)), null);

  // keyContext() -- dim/aug/sus/dominant chords list candidate keys instead
  // of picking one. Fixed textbook facts (theory.js's AMBIGUOUS_KEYS), not
  // computed -- so these are the assertions that catch a mistyped offset.
  eq("diminished chord lists both candidate keys",
     T.keyContext(T.detect([0,3,6], 0)).chords.map(c => c.name + " " + c.rn).join(", "),
     "C# major vii°, A# minor ii°");
  eq("augmented chord lists its one candidate key",
     T.keyContext(T.detect([0,4,8], 0)).chords.map(c => c.name + " " + c.rn).join(", "),
     "A minor III+");
  eq("dominant 7 lists the key it's V of",
     T.keyContext(T.detect([7,11,2,5], 7)).chords.map(c => c.name + " " + c.rn).join(", "),
     "C major V");
  eq("sus4 lists the major/minor ambiguity on the same root",
     T.keyContext(T.detect([0,5,7], 0)).chords.map(c => c.name + " " + c.rn).join(", "),
     "C major I, C minor i");
  eq("minor 7 flat 5 joins the diminished family",
     T.keyContext(T.detect([0,3,6,10], 0)).chords.map(c => c.name + " " + c.rn).join(", "),
     "C# major vii°, A# minor ii°");
  // activeIdx tells results-ui.js which chip to highlight as "confirmed" --
  // wrong here once made the first "possible key" look like the answer
  // (blue) while the second sat in plain grey, though both are just
  // candidates. Diatonic panels legitimately highlight their tonic; the
  // ambiguous-keys panel must not highlight anything, 1 candidate or 2.
  eq("diatonic scale panel highlights the tonic chip",
     T.keyContext(T.detect([0,2,4,5,7,9,11], 0)).activeIdx, 0);
  eq("major-family panel highlights the I chip",
     T.keyContext(T.detect([0,4,7], 0)).activeIdx, 0);
  eq("possible-keys panel highlights nothing, even with one candidate",
     T.keyContext(T.detect([7,11,2,5], 7)).activeIdx, -1);
  eq("possible-keys panel highlights nothing, with two candidates either",
     T.keyContext(T.detect([0,5,7], 0)).activeIdx, -1);

  // Flat spelling. The toggle is a per-pitch-class table swap: theory takes a
  // boolean, never reads a global. Omitting it must keep the old behavior.
  eq("spell defaults to sharps",
     T.spell(1), "C#");
  eq("spell with flats on",
     T.spell(1, true), "Db");
  eq("detect without the flag is unchanged",
     T.detect([1,5,8], 1).label, "C# major — root position");
  eq("detect with flats on respells the root",
     T.detect([1,5,8], 1, true).label, "Db major — root position");
  eq("flats reach the inversion's bass note too",
     T.detect([8,0,3], 3, true).label, "Ab major — 2nd inversion (Eb in bass)");
  eq("diatonic triads of Db major in flats",
     T.diatonic(1, SP.data.MAJOR_IV, true).map(c => c.name).join(" "),
     "Db Ebm Fm Gb Ab Bbm C°");
  eq("keyContext inherits the spelling from the detect result",
     T.keyContext(T.detect([1,5,8,0], 1, true)).label,
     "Chords in the key of Db major (this chord as I)");
  // Accepted limitation, asserted so it can't be mistaken for a regression:
  // one name per pitch class means no per-degree letter math. Gb major's 7th
  // degree is Cb in theory and prints "B" here; its vii° prints "F°".
  eq("naive swap does not do key-correct letters",
     T.diatonic(6, SP.data.MAJOR_IV, true).map(c => c.name).join(" "),
     "Gb Abm Bbm B Db Ebm F°");

  const tally = document.getElementById("tally");
  tally.textContent = fail ? fail + " failed, " + pass + " passed" : "all " + pass + " passed";
  tally.className = fail ? "bad" : "ok";
})();
</script>
</body>
</html>
